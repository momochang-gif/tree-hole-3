<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教師心靈樹洞</title>
  <style>
    /* 全局樣式：星夜暗色調 */
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(22, 30, 46, 0.85);
      --accent-glow: #4fd1c5;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* 背景星空微光效果 */
    .stars {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                  radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.5), rgba(0,0,0,0)),
                  radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0));
      background-size: 200px 200px;
      z-index: 0;
      opacity: 0.3;
    }

    .container {
      z-index: 1;
      text-align: center;
      padding: 20px;
      max-width: 600px;
      width: 90%;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
      letter-spacing: 2px;
      color: #f1f5f9;
      text-shadow: 0 0 10px rgba(79, 209, 197, 0.3);
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    /* 幾何神木與樹洞 SVG 與呼吸燈 */
    .tree-container {
      position: relative;
      width: 200px;
      height: 240px;
      margin: 0 auto 30px auto;
      cursor: pointer;
    }

    .tree-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 15px rgba(79, 209, 197, 0.2));
    }

    .tree-hole {
      animation: pulse 3s infinite ease-in-out;
      transform-origin: center;
    }

    @keyframes pulse {
      0% { fill: #1a365d; filter: drop-shadow(0 0 2px #4fd1c5); }
      50% { fill: #2b6cb0; filter: drop-shadow(0 0 12px #4fd1c5); }
      100% { fill: #1a365d; filter: drop-shadow(0 0 2px #4fd1c5); }
    }

    .open-modal-btn {
      background: linear-gradient(135deg, #2b6cb0, #4c51bf);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1.1rem;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(76, 81, 191, 0.4);
      transition: all 0.3s ease;
    }

    .open-modal-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(76, 81, 191, 0.6);
    }

    /* Modal 彈窗機制 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 90%;
      max-width: 450px;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
      transition: all 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    /* 飛入樹洞動畫 Class */
    .modal-card.fly-into-hole {
      transform: scale(0.05) translate(0, -600px);
      opacity: 0;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .nickname-box {
      display: flex;
      gap: 10px;
    }

    input[type="text"], textarea {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 12px;
      color: white;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: var(--accent-glow);
    }

    .dice-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 0 15px;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
    }

    /* 分類選項按鈕 */
    .category-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .cat-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .cat-btn.selected {
      background: rgba(79, 209, 197, 0.2);
      border-color: var(--accent-glow);
      color: #fff;
    }

    /* 情緒顏色色塊 */
    .color-picker {
      display: flex;
      gap: 12px;
    }

    .color-option {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.2s;
    }

    .color-option.selected {
      transform: scale(1.2);
      border-color: white;
    }

    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #319795, #2b6cb0);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
    }

    /* 成功提示訊息 */
    .toast {
      position: fixed;
      bottom: 30px;
      background: rgba(49, 151, 149, 0.9);
      color: white;
      padding: 12px 24px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.4s ease;
      z-index: 200;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="stars"></div>

  <div class="container">
    <h1>教師心靈樹洞</h1>
    <p class="subtitle">這裡不對外公開，任何人皆無法看見。<br>將累積的心聲，沉入發光的神木中吧。</p>

    <!-- 幾何神木 SVG -->
    <div class="tree-container" onclick="openModal()">
      <svg class="tree-svg" viewBox="0 0 200 240">
        <!-- 樹幹 -->
        <polygon points="85,220 115,220 110,130 90,130" fill="#2d3748" />
        <!-- 幾何樹冠 (多層疊加) -->
        <polygon points="100,20 40,90 160,90" fill="#1a202c" stroke="#4fd1c5" stroke-width="1"/>
        <polygon points="100,50 30,130 170,130" fill="#2d3748" stroke="#319795" stroke-width="1" opacity="0.8"/>
        <polygon points="100,80 20,170 180,170" fill="#1a202c" stroke="#2b6cb0" stroke-width="1" opacity="0.9"/>
        <!-- 發光的樹洞 -->
        <ellipse class="tree-hole" cx="100" cy="160" rx="12" ry="18" />
      </svg>
    </div>

    <button class="open-modal-btn" onclick="openModal()">傾訴秘密</button>
  </div>

  <!-- 寫悄悄話 Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card" id="modalCard">
      <button class="close-btn" onclick="closeModal()">✕</button>
      
      <div class="form-group">
        <label>虛擬暱稱</label>
        <div class="nickname-box">
          <input type="text" id="nicknameInput" readonly>
          <button class="dice-btn" onclick="generateNickname()">🎲 隨機</button>
        </div>
      </div>

      <div class="form-group">
        <label>議題分類</label>
        <div class="category-group" id="categoryGroup">
          <button class="cat-btn selected" onclick="selectCategory(this, '工作')">工作</button>
          <button class="cat-btn" onclick="selectCategory(this, '夥伴')">夥伴</button>
          <button class="cat-btn" onclick="selectCategory(this, '學生')">學生</button>
          <button class="cat-btn" onclick="selectCategory(this, '課程')">課程</button>
          <button class="cat-btn" onclick="selectCategory(this, '個人議題')">個人議題</button>
        </div>
      </div>

      <div class="form-group">
        <label>情緒微光</label>
        <div class="color-picker">
          <div class="color-option selected" style="background: #3182ce;" data-color="憂鬱藍" onclick="selectColor(this)"></div>
          <div class="color-option" style="background: #ecc94b;" data-color="溫暖黃" onclick="selectColor(this)"></div>
          <div class="color-option" style="background: #805ad5;" data-color="秘密紫" onclick="selectColor(this)"></div>
          <div class="color-option" style="background: #ed64a6;" data-color="悸動粉" onclick="selectColor(this)"></div>
        </div>
      </div>

      <div class="form-group">
        <label>悄悄話內容</label>
        <textarea id="secretInput" rows="4" placeholder="寫下任何想封存的想法..."></textarea>
      </div>

      <button class="submit-btn" onclick="submitSecret()">封印並投入樹洞</button>
    </div>
  </div>

  <div class="toast" id="toast">心聲已緩緩沉入神木試算表...</div>

  <script>
    // 請在此處貼上 Google Apps Script 部署後的 Web App 網址
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxTOzToWOahNNgOzWYn72cCCiHP9PzKNHgnh7EtMo1XZHVowQjlemILscg0zvu4H73N/exec';

    // 隨機暱稱詞庫
    const prefixList = ['深海的', '聽風的話', '等待陽光的', '漫步的', '沉睡的', '發光的'];
    const suffixList = ['時光機', '松果', '雲朵', '微風', '小舟', '海龜'];

    let selectedCategory = '工作';
    let selectedColor = '憂鬱藍';

    function generateNickname() {
      const p = prefixList[Math.floor(Math.random() * prefixList.length)];
      const s = suffixList[Math.floor(Math.random() * suffixList.length)];
      document.getElementById('nicknameInput').value = `${p}${s}`;
    }

    function openModal() {
      generateNickname();
      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    function selectCategory(btn, cat) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedCategory = cat;
    }

    function selectColor(el) {
      document.querySelectorAll('.color-option').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      selectedColor = el.getAttribute('data-color');
    }

    function submitSecret() {
      const secret = document.getElementById('secretInput').value;
      const nickname = document.getElementById('nicknameInput').value;

      if (!secret.trim()) {
        alert('請先寫下你的悄悄話喔');
        return;
      }

      // 觸發「飛入樹洞」動畫
      const modalCard = document.getElementById('modalCard');
      modalCard.classList.add('fly-into-hole');

      // 準備發送到後台的資料
      const payload = {
        nickname: nickname,
        category: selectedCategory,
        secret: secret,
        colorName: selectedColor
      };

      // 背景默默傳送給 API
      if (GOOGLE_SCRIPT_URL !== 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL') {
        fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).catch(err => console.error("傳送失敗:", err));
      }

      // 動畫結束後復原與跳出 Toast
      setTimeout(() => {
        closeModal();
        modalCard.classList.remove('fly-into-hole');
        document.getElementById('secretInput').value = '';
        showToast();
      }, 800);
    }

    function showToast() {
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }
  </script>
</body>
</html>
